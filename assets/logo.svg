<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#111128"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0080ff"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="400" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="orb1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="orb2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="greenGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="320" rx="16" fill="url(#bg)"/>

  <!-- Ambient orbs -->
  <circle cx="120" cy="160" r="180" fill="url(#orb1)"/>
  <circle cx="780" cy="140" r="200" fill="url(#orb2)"/>
  <!-- Security green ambient -->
  <circle cx="85" cy="80" r="100" fill="#34d399" opacity="0.04"/>

  <!-- Grid lines (subtle) -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="0.5">
    <line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="160" x2="900" y2="160"/>
    <line x1="0" y1="240" x2="900" y2="240"/>
    <line x1="150" y1="0" x2="150" y2="320"/>
    <line x1="300" y1="0" x2="300" y2="320"/>
    <line x1="450" y1="0" x2="450" y2="320"/>
    <line x1="600" y1="0" x2="600" y2="320"/>
    <line x1="750" y1="0" x2="750" y2="320"/>
  </g>

  <!-- Decorative circuit traces -->
  <g opacity="0.12" stroke="#00f0ff" stroke-width="1" fill="none">
    <path d="M 40,60 L 80,60 L 100,80 L 100,120"/>
    <circle cx="100" cy="125" r="3" fill="#00f0ff"/>
    <path d="M 30,200 L 60,200 L 80,180"/>
    <circle cx="83" cy="177" r="3" fill="#00f0ff"/>
    <path d="M 50,270 L 90,270 L 110,250 L 110,220"/>
    <circle cx="110" cy="217" r="3" fill="#00f0ff"/>
    <path d="M 860,50 L 820,50 L 800,70 L 800,110"/>
    <circle cx="800" cy="113" r="3" fill="#a855f7" opacity="0.8"/>
    <path d="M 870,180 L 830,180 L 810,200 L 810,240"/>
    <circle cx="810" cy="243" r="3" fill="#a855f7" opacity="0.8"/>
    <path d="M 850,280 L 820,280 L 800,260"/>
    <circle cx="797" cy="257" r="3" fill="#f472b6" opacity="0.6"/>
  </g>

  <!-- Shield icon (Security First) — top left -->
  <g transform="translate(68, 36)">
    <!-- Shield glow aura -->
    <path d="M 50,4 L 82,20 L 82,54 Q 82,78 50,94 Q 18,78 18,54 L 18,20 Z" fill="#34d399" opacity="0.05" filter="url(#greenGlow)"/>
    <!-- Shield outline -->
    <path d="M 50,12 L 74,24 L 74,50 Q 74,70 50,82 Q 26,70 26,50 L 26,24 Z" stroke="url(#shieldGrad)" stroke-width="2" fill="#0a0a1a" opacity="0.95" filter="url(#glow)"/>
    <!-- Inner shield highlight -->
    <path d="M 50,20 L 67,29 L 67,48 Q 67,63 50,72 Q 33,63 33,48 L 33,29 Z" fill="#34d399" opacity="0.08"/>
    <!-- Lock body -->
    <rect x="42" y="44" width="16" height="13" rx="2.5" fill="#34d399" opacity="0.85"/>
    <!-- Lock shackle -->
    <path d="M 45,44 L 45,38 Q 45,32 50,32 Q 55,32 55,38 L 55,44" stroke="#34d399" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <!-- Lock keyhole -->
    <circle cx="50" cy="49" r="2" fill="#0a0a1a"/>
    <rect x="49" y="50" width="2" height="3.5" rx="0.5" fill="#0a0a1a"/>
    <!-- Checkmark -->
    <path d="M 58,28 L 62,33 L 70,22" stroke="#34d399" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
  </g>

  <!-- Bot icon -->
  <g transform="translate(140, 90)">
    <!-- Outer ring -->
    <circle cx="50" cy="55" r="52" stroke="url(#cyan)" stroke-width="1.5" fill="none" opacity="0.3"/>
    <circle cx="50" cy="55" r="44" stroke="url(#purple)" stroke-width="1" fill="none" opacity="0.15"/>
    <!-- Head -->
    <rect x="14" y="20" width="72" height="58" rx="14" stroke="url(#cyan)" stroke-width="2" fill="#0a0a1a" filter="url(#glow)"/>
    <!-- Antenna -->
    <line x1="50" y1="20" x2="50" y2="6" stroke="url(#cyan)" stroke-width="2"/>
    <circle cx="50" cy="4" r="4" fill="#00f0ff" opacity="0.9"/>
    <circle cx="50" cy="4" r="7" fill="#00f0ff" opacity="0.15"/>
    <!-- Eyes -->
    <circle cx="34" cy="44" r="7" fill="#0080ff" opacity="0.9"/>
    <circle cx="34" cy="44" r="4" fill="#00f0ff"/>
    <circle cx="66" cy="44" r="7" fill="#8b5cf6" opacity="0.9"/>
    <circle cx="66" cy="44" r="4" fill="#a855f7"/>
    <!-- Mouth -->
    <line x1="34" y1="62" x2="66" y2="62" stroke="#00f0ff" stroke-width="1.5" opacity="0.5" stroke-linecap="round"/>
    <line x1="38" y1="66" x2="62" y2="66" stroke="#a855f7" stroke-width="1.5" opacity="0.35" stroke-linecap="round"/>
    <!-- Ear nodes -->
    <rect x="6" y="38" width="8" height="14" rx="3" fill="#0080ff" opacity="0.5"/>
    <rect x="86" y="38" width="8" height="14" rx="3" fill="#8b5cf6" opacity="0.5"/>
    <!-- Body -->
    <path d="M 28,78 L 28,95 Q 28,102 35,102 L 65,102 Q 72,102 72,95 L 72,78" stroke="url(#cyan)" stroke-width="1.5" fill="#0a0a1a" opacity="0.6"/>
    <circle cx="42" cy="90" r="2.5" fill="#00f0ff" opacity="0.6"/>
    <circle cx="50" cy="90" r="2.5" fill="#a855f7" opacity="0.6"/>
    <circle cx="58" cy="90" r="2.5" fill="#f472b6" opacity="0.6"/>
  </g>

  <!-- Title text -->
  <text x="290" y="108" font-family="'SF Pro Display', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="68" font-weight="800" fill="url(#titleGrad)" letter-spacing="-2">Arix One</text>

  <!-- Subtitle -->
  <text x="293" y="138" font-family="'SF Mono', 'Cascadia Code', 'Fira Code', monospace" font-size="13" fill="#64748b" letter-spacing="1">ONE INTELLIGENCE. BUILT TO EXECUTE SAFELY.</text>

  <!-- Security First callout line -->
  <g transform="translate(290, 156)">
    <!-- Green bar accent -->
    <rect x="0" y="0" width="3" height="36" rx="1.5" fill="#34d399" opacity="0.8"/>
    <!-- Security line -->
    <text x="14" y="14" font-family="'SF Pro Display', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#34d399">Secure by design.</text>
    <!-- Build anything line -->
    <text x="156" y="14" font-family="'SF Pro Display', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" fill="#94a3b8">Build anything. Integrate everything. Just ask.</text>
    <!-- Framework not product -->
    <text x="14" y="32" font-family="'SF Pro Display', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b">A framework, not a product — the last AI architecture you'll need.</text>
  </g>

  <!-- Arix Architecture layer badges -->
  <g transform="translate(290, 210)">
    <!-- Goals -->
    <g>
      <rect x="0" y="0" width="78" height="28" rx="6" fill="#00f0ff" opacity="0.12" stroke="#00f0ff" stroke-width="0.8" stroke-opacity="0.3"/>
      <text x="39" y="18" font-family="'SF Mono', 'Cascadia Code', monospace" font-size="11" fill="#00f0ff" text-anchor="middle" font-weight="600">Goals</text>
    </g>
    <!-- Orchestration -->
    <g>
      <rect x="88" y="0" width="116" height="28" rx="6" fill="#a855f7" opacity="0.12" stroke="#a855f7" stroke-width="0.8" stroke-opacity="0.3"/>
      <text x="146" y="18" font-family="'SF Mono', 'Cascadia Code', monospace" font-size="11" fill="#a855f7" text-anchor="middle" font-weight="600">Orchestration</text>
    </g>
    <!-- Tools -->
    <g>
      <rect x="214" y="0" width="72" height="28" rx="6" fill="#f472b6" opacity="0.12" stroke="#f472b6" stroke-width="0.8" stroke-opacity="0.3"/>
      <text x="250" y="18" font-family="'SF Mono', 'Cascadia Code', monospace" font-size="11" fill="#f472b6" text-anchor="middle" font-weight="600">Tools</text>
    </g>
    <!-- Context -->
    <g>
      <rect x="296" y="0" width="82" height="28" rx="6" fill="#34d399" opacity="0.12" stroke="#34d399" stroke-width="0.8" stroke-opacity="0.3"/>
      <text x="337" y="18" font-family="'SF Mono', 'Cascadia Code', monospace" font-size="11" fill="#34d399" text-anchor="middle" font-weight="600">Context</text>
    </g>
    <!-- Hardprompts -->
    <g>
      <rect x="388" y="0" width="108" height="28" rx="6" fill="#fb923c" opacity="0.12" stroke="#fb923c" stroke-width="0.8" stroke-opacity="0.3"/>
      <text x="442" y="18" font-family="'SF Mono', 'Cascadia Code', monospace" font-size="11" fill="#fb923c" text-anchor="middle" font-weight="600">Templates</text>
    </g>
    <!-- Args -->
    <g>
      <rect x="506" y="0" width="66" height="28" rx="6" fill="#3b82f6" opacity="0.12" stroke="#3b82f6" stroke-width="0.8" stroke-opacity="0.3"/>
      <text x="539" y="18" font-family="'SF Mono', 'Cascadia Code', monospace" font-size="11" fill="#3b82f6" text-anchor="middle" font-weight="600">Config</text>
    </g>
  </g>

  <!-- Bottom — "Say it. Build it." examples -->
  <g transform="translate(290, 260)">
    <text x="0" y="14" font-family="'SF Mono', 'Cascadia Code', monospace" font-size="12" fill="#475569">"Build me a Slack integration"</text>
    <text x="260" y="14" font-family="'SF Mono', 'Cascadia Code', monospace" font-size="12" fill="#34d399">&#x2192; Done.</text>
    <text x="330" y="14" font-family="'SF Mono', 'Cascadia Code', monospace" font-size="12" fill="#475569">"Add a Discord bot"</text>
    <text x="530" y="14" font-family="'SF Mono', 'Cascadia Code', monospace" font-size="12" fill="#34d399">&#x2192; Done.</text>
    <text x="594" y="14" font-family="'SF Mono', 'Cascadia Code', monospace" font-size="12" fill="#475569">"Ship it."</text>
    <text x="665" y="14" font-family="'SF Mono', 'Cascadia Code', monospace" font-size="12" fill="#34d399">&#x2192; Done.</text>
  </g>

  <!-- Bottom accent line -->
  <rect x="40" y="300" width="820" height="1" rx="0.5" fill="url(#titleGrad)" opacity="0.15"/>
</svg>
